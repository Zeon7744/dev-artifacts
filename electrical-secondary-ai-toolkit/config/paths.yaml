# 配置文件

## 路径配置
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_knowledge_graph: "data/knowledge_graph"
  data_training: "data/training_data"
  models_pretrained: "models/pretrained"
  models_trained: "models/trained"
  outputs: "output"
  docs: "docs"
  examples: "examples"
  tests: "tests"

## 标准文档路径
standards:
  main_document: "converted_docs/广东电网有限责任公司厂站二次设备及其二次回路工作安全技术措施单实施细则（2025版）.docx"
  appendix1: "converted_docs/资料性附录1：二次措施单格式.docx"
  appendix2: "converted_docs/资料性附录2：二次线拆接表（参考模版）.docx"
  appendix4_dir: "converted_docs/appendix4"

## 模型配置
models:
  nlp_model: "hfl/chinese-roberta-wwm-ext"
  embedding_model: "text2vec-base-chinese"
  llm_model: "qwen2.5-7b-instruct"
  
  training:
    batch_size: 16
    epochs: 10
    learning_rate: 0.0001
    max_length: 512

## 知识图谱配置
knowledge_graph:
  database_type: "neo4j"  # neo4j, networkx, sqlite
  neo4j_url: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "password"
  
  node_types:
    - equipment  # 设备
    - component  # 部件
    - action     # 操作
    - rule       # 规则
    - risk       # 风险
    
  relation_types:
    - "属于"      # belongs_to
    - "包含"      # contains
    - "需要"      # requires
    - "禁止"      # prohibited
    - "必须"      # mandatory
    - "关联"      # related_to

## API配置
api:
  host: "0.0.0.0"
  port: 8000
  debug: true
  
  cors:
    origins: ["*"]
    
  rate_limit:
    requests_per_minute: 60
    burst: 10

## 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
