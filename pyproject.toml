[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stock-analyzer"
version = "1.0.0"
description = "MLP精准金融分析工具 - 股票分析、技术指标、ML预测"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zeon7744", email = "zeon7744@gmail.com"}
]
keywords = ["finance", "stock", "analysis", "mlp", "trading", "technical-indicators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.8"
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
stock-analyzer = "cli:main"
stock-analyzer-mcp = "mcp_server:run_server"

[project.urls]
Homepage = "https://github.com/Zeon7744/stock-analyzer"
Documentation = "https://github.com/Zeon7744/stock-analyzer#readme"
Repository = "https://github.com/Zeon7744/stock-analyzer.git"
Issues = "https://github.com/Zeon7744/stock-analyzer/issues"

[tool.setuptools.packages.find]
include = ["*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
