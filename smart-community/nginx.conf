# Smart Community 前端 Nginx 配置
# - 静态资源托管（React SPA，history 路由回退 index.html）
# - /api 普通 HTTP 请求反代后端
# - /api/ws WebSocket 反代后端（带 Upgrade 头）

upstream smart_backend {
    # docker-compose 服务名解析；独立运行容器时可改为后端地址
    server backend:8000;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # WebSocket 端点：必须放在 /api 之前，优先匹配
    location /api/ws {
        proxy_pass http://smart_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 普通 API 请求
    location /api/ {
        proxy_pass http://smart_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 长轮询兼容
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
