[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "investment-mcp"
version = "1.0.0"
description = "统一投资分析MCP服务器 - 整合crypto/commodity/global-investment三大MLP项目"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zeon7744", email = "zeon7744@gmail.com"}
]
keywords = ["investment", "mcp", "crypto", "commodity", "fund", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
crypto = [
    "torch>=2.0.0",
    "optuna>=3.0.0",
]
commodity = [
    "scikit-learn>=1.0.0",
    "fastapi>=0.100.0",
]

[project.scripts]
investment-mcp = "server_core:run_server"

[project.urls]
Homepage = "https://github.com/Zeon7744/dev-artifacts"
Repository = "https://github.com/Zeon7744/dev-artifacts.git"

[tool.setuptools.packages.find]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
