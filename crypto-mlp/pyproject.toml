[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "crypto-mlp"
version = "1.1.0"
description = "加密货币智能分析系统 - MLP+LSTM双模型，风险管理，超参数优化"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zeon7744", email = "zeon7744@gmail.com"}
]
keywords = ["crypto", "mlp", "lstm", "bitcoin", "ethereum", "prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "optuna>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
crypto-mlp = "crypto_mlp:main"

[project.urls]
Homepage = "https://github.com/Zeon7744/dev-artifacts"
Repository = "https://github.com/Zeon7744/dev-artifacts.git"

[tool.setuptools.packages.find]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
